{% extends "base.html" %}

{% block title %}
    Add Ebook
{% endblock %}

{% block navigation %}

    <nav>

        <a href="{{ url_for('admin_dashboard') }}">
            Dashboard
        </a>

        <a href="{{ url_for('manage_books') }}">
            Ebooks
        </a>

        <a href="{{ url_for('manage_categories') }}">
            Categories
        </a>

        <a href="{{ url_for('admin_orders') }}">
            Orders
        </a>

        <a href="{{ url_for('admin_customers') }}">
            Customers
        </a>

        <a href="{{ url_for('admin_payments') }}">
            Payments
        </a>

        <a href="{{ url_for('logout') }}">
            Logout
        </a>

    </nav>

{% endblock %}

{% block content %}

    <h2>Add New Ebook</h2>

    <form method="POST" enctype="multipart/form-data">

        <label>Title:</label>
        <input type="text" name="title" required>

        <br><br>

        <label>Author:</label>
        <input type="text" name="author" required>

        <br><br>

        <label>Description:</label>
        <br>

        <textarea
            name="description"
            rows="5"
            cols="40"
        ></textarea>

        <br><br>

        <label>Category:</label>

        <select name="category_id" required>

            <option value="">
                Select Category
            </option>

            {% for category in categories %}

                <option value="{{ category[0] }}">
                    {{ category[1] }}
                </option>

            {% endfor %}

        </select>

        <br><br>

        <label>Price:</label>
        <input
            type="number"
            name="price"
            step="0.01"
            min="0"
            required
        >

        <br><br>

        <label>Cover Image:</label>
        <input
            type="file"
            name="cover_image"
            accept="image/*"
        >

        <br><br>

        <label>Ebook PDF:</label>
        <input
            type="file"
            name="ebook_file"
            accept=".pdf"
            required
        >

        <br><br>

        <button type="submit">
            Upload Ebook
        </button>

    </form>

    <br>

    <a href="{{ url_for('manage_books') }}">
        Back to Ebooks
    </a>

{% endblock %}
