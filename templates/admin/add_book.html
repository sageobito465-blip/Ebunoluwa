{% extends "base.html" %}

{% block title %}
    Add Ebook
{% endblock %}

{% block navigation %}

    <nav>

        <a href="{{ url_for('admin_dashboard') }}">
            Dashboard
        </a>

        <a href="{{ url_for('manage_books') }}">
            Ebooks
        </a>

        <a href="{{ url_for('manage_categories') }}">
            Categories
        </a>

        <a href="{{ url_for('admin_orders') }}">
            Orders
        </a>

        <a href="{{ url_for('admin_customers') }}">
            Customers
        </a>

        <a href="{{ url_for('admin_payments') }}">
            Payments
        </a>

        <a href="{{ url_for('logout') }}">
            Logout
        </a>

    </nav>

{% endblock %}

{% block content %}

    <section class="admin-form-page">

        <div class="admin-form-card">

            <h2>Add New Ebook</h2>

            <p class="admin-form-intro">
                Add a new ebook to the shop.
            </p>

            <form
                method="POST"
                enctype="multipart/form-data"
            >

                <label for="title">
                    Title
                </label>

                <input
                    id="title"
                    type="text"
                    name="title"
                    required
                >

                <label for="author">
                    Author
                </label>

                <input
                    id="author"
                    type="text"
                    name="author"
                    required
                >

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    name="description"
                    rows="5"
                ></textarea>

                <label for="category">
                    Category
                </label>

                <select
                    id="category"
                    name="category_id"
                    required
                >

                    <option value="">
                        Select Category
                    </option>

                    {% for category in categories %}

                        <option value="{{ category[0] }}">
                            {{ category[1] }}
                        </option>

                    {% endfor %}

                </select>

                <label for="price">
                    Price
                </label>

                <input
                    id="price"
                    type="number"
                    name="price"
                    step="0.01"
                    min="0"
                    required
                >

                <label for="cover_image">
                    Cover Image
                </label>

                <input
                    id="cover_image"
                    type="file"
                    name="cover_image"
                    accept="image/*"
                >

                <label for="ebook_file">
                    Ebook PDF
                </label>

                <input
                    id="ebook_file"
                    type="file"
                    name="ebook_file"
                    accept=".pdf"
                    required
                >

                <button type="submit">
                    Upload Ebook
                </button>

            </form>

            <a
                href="{{ url_for('manage_books') }}"
                class="back-link"
            >
                Back to Ebooks
            </a>

        </div>

    </section>

{% endblock %}
