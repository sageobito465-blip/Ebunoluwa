{% extends "base.html" %}

{% block title %}
    Edit Ebook
{% endblock %}

{% block navigation %}

    <nav class="site-nav admin-nav">

        <a href="{{ url_for('admin_dashboard') }}">
            Dashboard
        </a>

        <a href="{{ url_for('manage_books') }}">
            Ebooks
        </a>

        <a href="{{ url_for('manage_categories') }}">
            Categories
        </a>

        <a href="{{ url_for('admin_orders') }}">
            Orders
        </a>

        <a href="{{ url_for('admin_customers') }}">
            Customers
        </a>

        <a href="{{ url_for('admin_payments') }}">
            Payments
        </a>

        <form method="POST" action="{{ url_for('logout') }}" class="nav-logout-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="nav-link-button">Logout</button>
        </form>

    </nav>

{% endblock %}

{% block content %}

    <section class="admin-form-page">

        <div class="admin-form-card">

            <h2>Edit Ebook</h2>

            <p class="admin-form-intro">
                Update the ebook information below.
            </p>

            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <label for="title">
                    Title
                </label>

                <input
                    id="title"
                    type="text"
                    name="title"
                    value="{{ book[1] }}"
                    required
                >

                <label for="author">
                    Author
                </label>

                <input
                    id="author"
                    type="text"
                    name="author"
                    value="{{ book[2] }}"
                    required
                >

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    name="description"
                    rows="5"
                >{{ book[3] }}</textarea>

                <label for="category">
                    Category
                </label>

                <select
                    id="category"
                    name="category_id"
                    required
                >

                    {% for category in categories %}

                        <option
                            value="{{ category[0] }}"
                            {% if category[0] == book[4] %}
                                selected
                            {% endif %}
                        >
                            {{ category[1] }}
                        </option>

                    {% endfor %}

                </select>

                <label for="price">
                    Price
                </label>

                <input
                    id="price"
                    type="number"
                    name="price"
                    value="{{ book[5] }}"
                    step="0.01"
                    min="0"
                    required
                >

                <button type="submit">
                    Save Changes
                </button>

            </form>

            <a
                href="{{ url_for('manage_books') }}"
                class="back-link"
            >
                Back to Ebooks
            </a>

        </div>

    </section>

{% endblock %}
