<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Ebook</title>
</head>
<body>

    <h1>Edit Ebook</h1>

    <form method="POST">

        <label>Title:</label>
        <input
            type="text"
            name="title"
            value="{{ book[1] }}"
            required
        >

        <br><br>

        <label>Author:</label>
        <input
            type="text"
            name="author"
            value="{{ book[2] }}"
            required
        >

        <br><br>

        <label>Description:</label>
        <br>
        <textarea
            name="description"
            rows="5"
            cols="40"
        >{{ book[3] }}</textarea>

        <br><br>

        <label>Category:</label>

        <select name="category_id" required>

            {% for category in categories %}

                <option
                    value="{{ category[0] }}"
                    {% if category[0] == book[4] %}selected{% endif %}
                >
                    {{ category[1] }}
                </option>

            {% endfor %}

        </select>

        <br><br>

        <label>Price:</label>
        <input
            type="number"
            name="price"
            value="{{ book[5] }}"
            step="0.01"
            min="0"
            required
        >

        <br><br>

        <button type="submit">
            Save Changes
        </button>

    </form>

    <br>

    <a href="{{ url_for('manage_books') }}">
        Back to Ebooks
    </a>

</body>
</html>
