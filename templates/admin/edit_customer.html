<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Customer</title>
</head>
<body>

    <h1>Edit Customer</h1>

    <form method="POST">

        <label>Name:</label>
        <input
            type="text"
            name="name"
            value="{{ customer[1] }}"
            required
        >

        <br>

        <label>Email:</label>
        <input
            type="email"
            name="email"
            value="{{ customer[2] }}"
            required
        >

        <br>

        <button type="submit">
            Save Changes
        </button>

    </form>

    <br>

    <a href="{{ url_for('admin_customer_details', customer_id=customer[0]) }}">
        Cancel
    </a>

</body>
</html>
