{% extends "base.html" %}

{% block title %}
    Edit Customer
{% endblock %}

{% block navigation %}

    <nav>

        <a href="{{ url_for('admin_dashboard') }}">
            Dashboard
        </a>

        <a href="{{ url_for('manage_books') }}">
            Ebooks
        </a>

        <a href="{{ url_for('manage_categories') }}">
            Categories
        </a>

        <a href="{{ url_for('admin_orders') }}">
            Orders
        </a>

        <a href="{{ url_for('admin_customers') }}">
            Customers
        </a>

        <a href="{{ url_for('admin_payments') }}">
            Payments
        </a>

        <form method="POST" action="{{ url_for('logout') }}" class="nav-logout-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="nav-link-button">Logout</button>
        </form>

    </nav>

{% endblock %}

{% block content %}

    <section class="admin-form-page">

        <div class="admin-form-card">

            <h2>Edit Customer</h2>

            <p class="admin-form-intro">
                Update the customer information below.
            </p>

            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <label for="name">
                    Name
                </label>

                <input
                    id="name"
                    type="text"
                    name="name"
                    value="{{ customer[1] }}"
                    required
                >

                <label for="email">
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    name="email"
                    value="{{ customer[2] }}"
                    required
                >

                <button type="submit">
                    Save Changes
                </button>

            </form>

            <a
                href="{{ url_for('admin_customer_details', customer_id=customer[0]) }}"
                class="back-link"
            >
                Cancel
            </a>

        </div>

    </section>

{% endblock %}
