<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Orders</title>
</head>
<body>

    <h1>Manage Orders</h1>

    {% if orders %}

        {% for order in orders %}

            <h2>Order #{{ order[0] }}</h2>

            <p>
                <strong>Customer:</strong>
                {{ order[1] }}
            </p>

            <p>
                <strong>Email:</strong>
                {{ order[2] }}
            </p>

            <p>
                <strong>Total:</strong>
                ₦{{ order[3] }}
            </p>

            <p>
                <strong>Status:</strong>
                {{ order[4] }}
            </p>

            <p>
                <strong>Date:</strong>
                {{ order[5] }}
            </p>

            <hr>

        {% endfor %}

    {% else %}

        <p>No orders found.</p>

    {% endif %}

    <a href="{{ url_for('admin_dashboard') }}">
        Back to Dashboard
    </a>

</body>
</html>
