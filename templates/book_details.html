<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Details</title>
</head>
<body>

    <h1>{{ book[1] }}</h1>

    <p><strong>Author:</strong> {{ book[2] }}</p>

    <p><strong>Category:</strong> {{ book[5] }}</p>

    <p><strong>Description:</strong> {{ book[3] }}</p>

    <p><strong>Price:</strong> ₦{{ book[4] }}</p>

    <a href="{{ url_for('add_to_cart', book_id=book[0]) }}">
    Add to Cart
    </a>

</body>
</html>
