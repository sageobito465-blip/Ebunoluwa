<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Cart</title>
</head>
<body>

    <h1>My Cart</h1>

    {% if cart_items %}

        {% for item in cart_items %}

            <h2>{{ item[1] }}</h2>

            <p><strong>Author:</strong> {{ item[2] }}</p>

            <p><strong>Price:</strong> ₦{{ item[3] }}</p>

            <form method="POST" action="{{ url_for('update_cart', cart_id=item[0]) }}">

                <label>Quantity:</label>

                <input
                    type="number"
                    name="quantity"
                    value="{{ item[4] }}"
                    min="1"
                    required
                >

                <button type="submit">Update</button>

            </form>

            <a href="{{ url_for('remove_from_cart', cart_id=item[0]) }}">
                Remove
            </a>

        {% endfor %}

        <h2>Total: ₦{{ total }}</h2>
        <a href="{{ url_for('checkout') }}">
            Checkout
        </a>

    {% else %}

        <p>Your cart is empty.</p>

    {% endif %}

</body>
</html>
