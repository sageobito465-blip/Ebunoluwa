{% extends "base.html" %}

{% block title %}
    Cart
{% endblock %}

{% block navigation %}

    <nav class="site-nav">

        <a href="{{ url_for('home') }}">
            Home
        </a>

        <a href="{{ url_for('cart') }}">
            Cart
        </a>

        <a href="{{ url_for('customer_orders') }}">
            My Orders
        </a>

        <a href="{{ url_for('customer_library') }}">
            My Library
        </a>

        <form method="POST" action="{{ url_for('logout') }}" class="nav-logout-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="nav-link-button">Logout</button>
        </form>

    </nav>

{% endblock %}

{% block content %}

    <div class="cart-message">

        <h2>{{ message }}</h2>

        <a href="{{ url_for('cart') }}">
            View Cart
        </a>

        <a href="{{ url_for('home') }}">
            Continue Shopping
        </a>

    </div>

{% endblock %}
