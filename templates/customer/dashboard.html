{% extends "base.html" %}

{% block title %}
    Customer Dashboard
{% endblock %}

{% block navigation %}

    <nav class="site-nav">

        <a href="{{ url_for('home') }}">
            Home
        </a>

        <a href="{{ url_for('cart') }}">
            Cart
        </a>

        <a href="{{ url_for('customer_orders') }}">
            My Orders
        </a>

        <a href="{{ url_for('customer_library') }}">
            My Library
        </a>

        <form method="POST" action="{{ url_for('logout') }}" class="nav-logout-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="nav-link-button">Logout</button>
        </form>

    </nav>

{% endblock %}

{% block content %}

    <section class="dashboard-page">

        <div class="dashboard-card">

            <h2>Welcome, {{ user[0] }}!</h2>

            <p class="dashboard-intro">
                Welcome to your ebook shop account.
            </p>

            <div class="account-info">

                <p>
                    <strong>Email:</strong>
                    {{ user[1] }}
                </p>

                <p>
                    <strong>Account:</strong>
                    Customer
                </p>

            </div>

            <a
                href="{{ url_for('home') }}"
                class="button"
            >
                Browse Ebooks
            </a>

        </div>

    </section>

{% endblock %}
