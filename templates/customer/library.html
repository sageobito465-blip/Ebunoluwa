<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Library</title>
</head>
<body>

    <h1>My Library</h1>

    {% if books %}

        {% for book in books %}

            <h2>{{ book[1] }}</h2>

            <p>
                <strong>Author:</strong>
                {{ book[2] }}
            </p>

            <a href="{{ url_for('download_ebook', book_id=book[0]) }}">
                Download Ebook
            </a>


        {% endfor %}

    {% else %}

        <p>Your library is empty.</p>

    {% endif %}

</body>
</html>
