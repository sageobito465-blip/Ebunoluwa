{% extends "base.html" %}

{% block title %}
    Customer Login
{% endblock %}

{% block navigation %}

    <nav>

        <a href="{{ url_for('home') }}">
            Home
        </a>

        <a href="{{ url_for('login') }}">
            Login
        </a>

        <a href="{{ url_for('register') }}">
            Register
        </a>

    </nav>

{% endblock %}

{% block content %}

    <section class="auth-page">

        <div class="auth-card">

            <h2>Customer Login</h2>

            <p class="auth-intro">
                Login to access your ebook account.
            </p>

            <form method="POST">

                <label for="email">
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    name="email"
                    required
                >

                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    name="password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <p class="auth-footer">
                Don't have an account?

                <a href="{{ url_for('register') }}">
                    Register here
                </a>
            </p>

        </div>

    </section>

{% endblock %}
