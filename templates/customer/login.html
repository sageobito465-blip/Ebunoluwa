{% extends "base.html" %}

{% block title %}
    Customer Login
{% endblock %}

{% block navigation %}

    <nav>

        <a href="{{ url_for('home') }}">
            Home
        </a>

        <a href="{{ url_for('login') }}">
            Login
        </a>

        <a href="{{ url_for('register') }}">
            Register
        </a>

    </nav>

{% endblock %}

{% block content %}

    <h2>Customer Login</h2>

    <form method="POST">

        <label>Email:</label>

        <input
            type="email"
            name="email"
            required
        >

        <br><br>

        <label>Password:</label>

        <input
            type="password"
            name="password"
            required
        >

        <br><br>

        <button type="submit">
            Login
        </button>

    </form>

    <br>

    <p>
        Don't have an account?

        <a href="{{ url_for('register') }}">
            Register here
        </a>
    </p>

{% endblock %}
