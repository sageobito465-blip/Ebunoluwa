{% extends "base.html" %}

{% block title %}
    Customer Registration
{% endblock %}

{% block navigation %}

    <nav>

        <a href="{{ url_for('home') }}">
            Home
        </a>

        <a href="{{ url_for('login') }}">
            Login
        </a>

        <a href="{{ url_for('register') }}">
            Register
        </a>

    </nav>

{% endblock %}

{% block content %}

    <section class="auth-page">

        <div class="auth-card">

            <h2>Customer Registration</h2>

            <p class="auth-intro">
                Create your ebook shop account.
            </p>

            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <label for="name">
                    Name
                </label>

                <input
                    id="name"
                    type="text"
                    name="name"
                    required
                >

                <label for="email">
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    name="email"
                    required
                >

                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    name="password"
                    required
                >

                <button type="submit">
                    Register
                </button>

            </form>

            <p class="auth-footer">
                Already have an account?

                <a href="{{ url_for('login') }}">
                    Login here
                </a>
            </p>

        </div>

    </section>

{% endblock %}
